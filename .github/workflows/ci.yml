name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          for p in simple-sc simple-ac; do
            go build -trimpath -o "dist/$p-${GOOS}-${GOARCH}$( [ "$GOOS" = windows ] && echo .exe )" "./cmd/$p"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        program: [simple-sc, simple-ac]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build (not pushed)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg PROGRAM=${{ matrix.program }} -f deploy/docker/Dockerfile .
          docker buildx build --load --build-arg PROGRAM=${{ matrix.program }} \
            -t ${{ matrix.program }}:ci -f deploy/docker/Dockerfile .
          docker image ls ${{ matrix.program }}:ci
      - name: first start in the container
        run: |
          docker run -d --name sscac-test -e SSCAC_LOG_LEVEL=debug ${{ matrix.program }}:ci
          sleep 3
          docker logs sscac-test 2>&1 | tee log.txt
          grep -q '"msg":"started"' log.txt
          docker rm -f sscac-test
