    complete: {}

  rc.subValUpd:
    title: "ReCon subscribe"
    initiator: ac
    note: "sent by the side that holds the values, the text says \"base station\""
    init:
      params: {type: "array", items: "parameter", spec: "Object[]"}
      syncCnt: {type: "integer", signed: false, spec: "Numeric"}
